<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contagem Regressiva – 50 anos da Elenice</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 45%, #fbc2eb 100%);
    color: #5a1f3a;
    overflow-x: hidden;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(8px);
    border-radius: 28px;
    padding: 40px 32px;
    max-width: 760px; width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(120, 30, 70, .25);
    position: relative; z-index: 2;
  }
  .emoji { font-size: 3rem; margin-bottom: 8px; }
  h1 { font-size: clamp(1.8rem, 6vw, 3rem); margin-bottom: 6px; }
  h1 span { color: #d6336c; }
  .sub { font-size: 1.1rem; opacity: .8; margin-bottom: 28px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .box {
    background: linear-gradient(160deg, #d6336c, #a61e4d);
    color: #fff; border-radius: 18px; padding: 18px 6px;
    box-shadow: 0 8px 18px rgba(166, 30, 77, .35);
  }
  .num { font-size: clamp(1.8rem, 8vw, 3.4rem); font-weight: bold; font-variant-numeric: tabular-nums; }
  .label { font-size: clamp(.7rem, 2.6vw, 1rem); text-transform: uppercase; letter-spacing: 1px; opacity: .9; }
  .date { margin-top: 26px; font-size: 1rem; opacity: .75; }
  .party h2 { font-size: clamp(2rem, 8vw, 3.4rem); color: #d6336c; margin: 10px 0; }
  .party p { font-size: 1.3rem; }
  .hidden { display: none; }
  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
</style>
</head>
<body>
<canvas id="confete"></canvas>

<div class="card">
  <div class="emoji">🎂</div>
  <h1>Falta pouco para os <span>50 anos</span> da <span>Elenice</span>!</h1>
  <p class="sub">Contagem regressiva para o dia 16 de dezembro</p>

  <div id="contador" class="grid">
    <div class="box"><div class="num" id="dias">0</div><div class="label">Dias</div></div>
    <div class="box"><div class="num" id="horas">0</div><div class="label">Horas</div></div>
    <div class="box"><div class="num" id="minutos">0</div><div class="label">Minutos</div></div>
    <div class="box"><div class="num" id="segundos">0</div><div class="label">Segundos</div></div>
  </div>

  <div id="festa" class="party hidden">
    <h2>🎉 Parabéns, Elenice! 🎉</h2>
    <p>Hoje você completa 50 anos! Muita saúde, alegria e amor! 💖</p>
  </div>

  <p class="date" id="data"></p>
</div>

<script>
  const DIA = 16, MES = 11; // 16 de dezembro (mês 11 = dezembro)

  function proximoAniversario() {
    const agora = new Date();
    let alvo = new Date(agora.getFullYear(), MES, DIA, 0, 0, 0);
    const fimDoDia = new Date(agora.getFullYear(), MES, DIA, 23, 59, 59);
    if (agora > fimDoDia) alvo = new Date(agora.getFullYear() + 1, MES, DIA, 0, 0, 0);
    return alvo;
  }

  const alvo = proximoAniversario();
  document.getElementById('data').textContent =
    'Aniversário: ' + alvo.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });

  const $ = id => document.getElementById(id);
  let festejando = false;

  function atualizar() {
    const agora = new Date();
    const diff = alvo - agora;

    if (diff <= 0) {
      $('contador').classList.add('hidden');
      $('festa').classList.remove('hidden');
      if (!festejando) { festejando = true; confete(); }
      return;
    }
    const s = Math.floor(diff / 1000);
    $('dias').textContent = Math.floor(s / 86400);
    $('horas').textContent = String(Math.floor((s % 86400) / 3600)).padStart(2, '0');
    $('minutos').textContent = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
    $('segundos').textContent = String(s % 60).padStart(2, '0');
  }

  function confete() {
    const c = $('confete'), ctx = c.getContext('2d');
    const ajustar = () => { c.width = innerWidth; c.height = innerHeight; };
    ajustar(); addEventListener('resize', ajustar);
    const cores = ['#d6336c','#ffd43b','#74c0fc','#69db7c','#fff','#f783ac'];
    const pecas = Array.from({ length: 160 }, () => ({
      x: Math.random() * c.width, y: Math.random() * -c.height,
      r: 4 + Math.random() * 6, v: 1.5 + Math.random() * 3,
      d: Math.random() * Math.PI * 2, cor: cores[Math.floor(Math.random() * cores.length)]
    }));
    (function quadro() {
      ctx.clearRect(0, 0, c.width, c.height);
      pecas.forEach(p => {
        p.y += p.v; p.d += 0.05; p.x += Math.sin(p.d);
        if (p.y > c.height) { p.y = -10; p.x = Math.random() * c.width; }
        ctx.fillStyle = p.cor;
        ctx.fillRect(p.x, p.y, p.r, p.r * 1.6);
      });
      requestAnimationFrame(quadro);
    })();
  }

  atualizar();
  setInterval(atualizar, 1000);
</script>
</body>
</html>
